name: CheckTheChain

# The .xcodeproj is generated from this file and gitignored. Edit here, then
# `xcodegen generate` — never edit the project in Xcode's inspector, or the
# change is lost on the next regeneration.

options:
  bundleIdPrefix: com.checkthechain
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  groupSortPosition: none

packages:
  HadithKit:
    path: HadithKit

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    # Simulator-only for now. Set DEVELOPMENT_TEAM when an Apple Developer
    # account exists and device builds are needed.
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGNING_ALLOWED: NO
  configs:
    Debug:
      # Optimize dependencies (HadithKit, GRDB) even in Debug. The vector scan
      # is 47k × 384 int8 dot products: 0.5ms at -O, 412ms at -Onone. Without
      # this, search is visibly laggy whenever the app is run from Xcode, which
      # is misleading about how the product actually performs. The app target
      # overrides this back to -Onone below so UI code stays debuggable.
      SWIFT_OPTIMIZATION_LEVEL: "-O"

targets:
  CheckTheChain:
    type: application
    platform: iOS
    sources:
      - path: CheckTheChain
        excludes:
          - "Resources/*.sqlite"
          - "Resources/*.bin"
          - "Resources/embeddings.json"
          - "Resources/vocab.txt"
      # The pipeline artifacts are large and regenerated, so they are declared
      # explicitly as resources rather than swept up by the recursive glob —
      # that way a missing artifact is a clear build error instead of an app
      # that launches and then can't find its corpus.
      - path: CheckTheChain/Resources/hadith.sqlite
        buildPhase: resources
      - path: CheckTheChain/Resources/embeddings.bin
        buildPhase: resources
      - path: CheckTheChain/Resources/embeddings.json
        buildPhase: resources
      - path: CheckTheChain/Resources/vocab.txt
        buildPhase: resources
    dependencies:
      - package: HadithKit
        product: HadithKit
    info:
      path: CheckTheChain/Info.plist
      properties:
        CFBundleDisplayName: Check the Chain
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIAppFonts:
          - NotoNaskhArabic-Regular.ttf
          - NotoNaskhArabic-Bold.ttf
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.checkthechain.app
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_UIStatusBarStyle: UIStatusBarStyleDefault
      configs:
        # App code stays unoptimized in Debug so breakpoints and the variable
        # inspector behave. Only the engine gets -O (see the project-level
        # setting above).
        Debug:
          SWIFT_OPTIMIZATION_LEVEL: "-Onone"

  HadithKitTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/HadithKitTests
    dependencies:
      - target: CheckTheChain
      - package: HadithKit
        product: HadithKit
    settings:
      base:
        # Hosted by the app so the tests read the same bundled corpus the app
        # ships. Running them against a separate copy would test the wrong
        # artifacts.
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/CheckTheChain.app/CheckTheChain"
        BUNDLE_LOADER: "$(TEST_HOST)"
        PRODUCT_BUNDLE_IDENTIFIER: com.checkthechain.app.tests

  CheckTheChainUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Tests/CheckTheChainUITests
    dependencies:
      - target: CheckTheChain
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.checkthechain.app.uitests
        TEST_TARGET_NAME: CheckTheChain

schemes:
  CheckTheChain:
    build:
      targets:
        CheckTheChain: all
        HadithKitTests: [test]
        CheckTheChainUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - HadithKitTests
        - CheckTheChainUITests
